# External check of the HelmTV sample server that Google reviewers log in to.
# Runs on GitHub's runners (not on the Pi or the home network). A failed run emails the repo owner and sends a
# push through the GitHub mobile app. The address and login are repository secrets, not written in this public file.
name: Sample server monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login works and a live stream is served
        env:
          BASE: ${{ secrets.SAMPLE_BASE_URL }}
          U: ${{ secrets.SAMPLE_USER }}
          P: ${{ secrets.SAMPLE_PASSWORD }}
        run: |
          set -u
          check() {
            curl -fsS -m 20 "$BASE/player_api.php?username=$U&password=$P" | grep -Eq '"auth": ?1' || return 1
            curl -fsS -m 20 "$BASE/player_api.php?username=$U&password=$P&action=get_live_streams" | grep -q '"stream_id"' || return 1
            curl -fsS -m 20 "$BASE/media/live/harbor-24/index.m3u8" | grep -q '^#EXTM3U' || return 1
          }
          for attempt in 1 2 3; do
            if check; then echo "sample server OK (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed"; sleep 20
          done
          echo "::error::Sample server login or stream check failed 3 times in a row"
          exit 1
